
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>💘 Valentine Madness 💘</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff4d6d, #ff85a1);
    font-family: "Comic Sans MS", cursive;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: white;
    text-align: center;
  }

  .container {
    z-index: 2;
  }

  h1 {
    font-size: 3rem;
    animation: glow 1.5s infinite alternate;
  }

  .name {
    font-size: 4rem;
    font-weight: bold;
    color: #ffff00;
    margin: 10px 0 20px;
    animation: flash 1s infinite alternate;
  }

  .buttons {
    margin-top: 20px;
    position: relative;
  }

  button {
    font-size: 1.3rem;
    padding: 12px 24px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 10px;
    position: relative;
    transition: left 0.3s ease, top 0.3s ease;
  }

  #yes {
    background: #00ff99;
  }

  #no {
    background: #ff3333;
    position: absolute;
    top: 0;
    left: 150px;
  }

  .cat {
    position: absolute;
    width: 200px;
    pointer-events: none;
    animation: float 4s linear infinite;
  }

  .heart, .confetti {
    position: absolute;
    font-size: 2rem;
    animation: fall 3s linear forwards;
  }

  @keyframes glow {
    from {
      text-shadow: 0 0 10px hotpink;
    }
    to {
      text-shadow: 0 0 30px red;
    }
  }

  @keyframes flash {
    0% {
      opacity: 1;
      text-shadow: 0 0 10px yellow;
    }
    50% {
      opacity: 0.5;
      text-shadow: 0 0 20px orange;
    }
    100% {
      opacity: 1;
      text-shadow: 0 0 10px yellow;
    }
  }

  @keyframes float {
    from {
      transform: translateY(100vh);
    }
    to {
      transform: translateY(-200px);
    }
  }

  @keyframes fall {
    to {
      transform: translateY(100vh);
      opacity: 0;
    }
  }

  /* Screen shake animation */
  @keyframes shake {
    0% { transform: translate(0,0); }
    20% { transform: translate(-10px,10px); }
    40% { transform: translate(10px,-10px); }
    60% { transform: translate(-10px,10px); }
    80% { transform: translate(10px,-10px); }
    100% { transform: translate(0,0); }
  }
</style>
</head>

<body>

<audio id="music" loop>
  <source src="https://www.bensound.com/bensound-music/bensound-cute.mp3" type="audio/mpeg" />
</audio>

<audio id="meow-sound">
  <source src="https://actions.google.com/sounds/v1/animals/cat_meow.ogg" type="audio/ogg" />
</audio>

<div class="container" id="main-container">
  <h1>💖 Will You Be My Valentine? 💖</h1>

  <div class="name">✨BAUWAA✨</div>

  <div class="buttons">
    <button id="yes">YES 😍</button>
    <button id="no">NO 😏</button>
  </div>
</div>

<script>
  const music = document.getElementById("music");
  const meowSound = document.getElementById("meow-sound");
  const mainContainer = document.getElementById("main-container");
  const noBtn = document.getElementById("no");

  document.addEventListener("click", () => {
    music.play();
  }, { once: true });

  const catGifs = [
    "https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif",
    "https://media.giphy.com/media/mlvseq9yvZhba/giphy.gif",
    "https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif",
    "https://media.giphy.com/media/l4KibK3JwaVo0CjDO/giphy.gif"
  ];

  function spawnCat() {
    const img = document.createElement("img");
    img.src = catGifs[Math.floor(Math.random() * catGifs.length)];
    img.className = "cat";
    img.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(img);
    setTimeout(() => img.remove(), 4000);
  }
  setInterval(spawnCat, 800);

  function explodeHearts() {
    for (let i = 0; i < 20; i++) {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.top = "-20px";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 3000);
    }
  }

  function explodeConfetti() {
    for (let i = 0; i < 20; i++) {
      const conf = document.createElement("div");
      conf.className = "confetti";
      conf.innerHTML = "🎉";
      conf.style.left = Math.random() * 100 + "vw";
      conf.style.top = "-20px";
      document.body.appendChild(conf);
      setTimeout(() => conf.remove(), 3000);
    }
  }

  document.getElementById("yes").onclick = () => {
    explodeHearts();
    explodeConfetti();
    alert("💘 YAYYY!! Valentine ACCEPTED 💘");
  };

  noBtn.addEventListener("mouseenter", () => {
    // Play meow sound on hover
    meowSound.currentTime = 0;
    meowSound.play();

    // Calculate new random position within viewport (80% width/height)
    const maxX = window.innerWidth * 0.8;
    const maxY = window.innerHeight * 0.8;

    let newX, newY;
    do {
      newX = Math.random() * maxX;
      newY = Math.random() * maxY;
      // Ensure new position is not too close to current position to avoid tiny jumps
    } while (
      Math.abs(newX - noBtn.offsetLeft) < 50 &&
      Math.abs(newY - noBtn.offsetTop) < 50
    );

    // Move button smoothly
    noBtn.style.left = newX + "px";
    noBtn.style.top = newY + "px";

    // Shake screen effect
    mainContainer.style.animation = "shake 0.5s";
    setTimeout(() => {
      mainContainer.style.animation = "";
    }, 500);
  });
</script>

</body>
</html>
