<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>💘 Valentine Madness 💘</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff4d6d, #ff85a1);
    font-family: "Comic Sans MS", cursive;
    color: white;
    text-align: center;
    overflow: hidden;
    position: relative;
  }
  .page {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 0.5s ease;
  }
  .hidden {
    opacity: 0;
    pointer-events: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
  }

  #proposal-page h1 {
    font-size: 3rem;
    animation: glow 1.5s infinite alternate;
  }
  #proposal-page .name {
    font-size: 4rem;
    font-weight: bold;
    color: #ffff00;
    margin: 10px 0 20px;
    animation: flash 1s infinite alternate;
  }
  #proposal-page .buttons {
    margin-top: 20px;
    position: relative;
    height: 60px;
    width: 320px;
  }
  #proposal-page button {
    font-size: 1.3rem;
    padding: 12px 24px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 10px;
    position: absolute;
    transition: left 0.3s ease, top 0.3s ease;
    user-select: none;
  }
  #yes {
    background: #00ff99;
    position: relative;
    left: 20px !important;
    top: 10px !important;
    margin: 10px !important;
  }
  #no {
    background: #ff3333;
    top: 10px;
    left: 180px;
  }

  #trap-page img.dancing-cat-gif {
    width: 320px;
    max-width: 90vw;
    border-radius: 15px;
    box-shadow: 0 0 20px yellow;
    animation: danceGlow 2s infinite alternate ease-in-out;
  }
  #trap-page h1 {
    font-size: 3rem;
    margin-top: 20px;
    text-shadow: 0 0 20px yellow;
  }

  /* Cats floating */
  .floating-cat {
    position: fixed;
    width: 80px;
    height: 80px;
    pointer-events: none;
    user-select: none;
    animation-name: floatUpDown;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }

  @keyframes floatUpDown {
    0% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
    100% { transform: translateY(0); }
  }

  /* Animations */
  @keyframes glow {
    from { text-shadow: 0 0 10px hotpink; }
    to { text-shadow: 0 0 30px red; }
  }
  @keyframes flash {
    0% { opacity: 1; text-shadow: 0 0 10px yellow; }
    50% { opacity: 0.5; text-shadow: 0 0 20px orange; }
    100% { opacity: 1; text-shadow: 0 0 10px yellow; }
  }
  @keyframes shake {
    0% { transform: translate(0,0); }
    20% { transform: translate(-10px,10px); }
    40% { transform: translate(10px,-10px); }
    60% { transform: translate(-10px,10px); }
    80% { transform: translate(10px,-10px); }
    100% { transform: translate(0,0); }
  }
  @keyframes danceGlow {
    0% { filter: drop-shadow(0 0 10px yellow); }
    100% { filter: drop-shadow(0 0 25px orange); }
  }
</style>
</head>
<body>

<!-- FUNKY DRUM LOOP MP3 for wide compatibility -->
<audio id="music" loop preload="auto" src="https://cdn.pixabay.com/download/audio/2023/03/26/audio_8a6d108f02.mp3?filename=upbeat-drum-loop-12537.mp3"></audio>

<!-- MEOW MP3 for best Mac Safari compatibility -->
<audio id="meow-sound" preload="auto" src="https://cdn.pixabay.com/download/audio/2023/03/29/audio_02f7e81f30.mp3?filename=cat-meow-1-4997.mp3"></audio>

<!-- Proposal Page -->
<div id="proposal-page" class="page">
  <h1>💖 Will You Be My Suar? 💖</h1>
  <div class="name">✨ BAUWAA ✨</div>
  <div class="buttons">
    <button id="yes">YES 😍</button>
    <button id="no">NO 😏</button>
  </div>
</div>

<!-- Trap Page -->
<div id="trap-page" class="page hidden">
  <img class="dancing-cat-gif" src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif" alt="Dancing cat gif" />
  <h1>Knew it, a piggy falls in the trap always!</h1>
</div>

<script>
  const music = document.getElementById('music');
  const meowSound = document.getElementById('meow-sound');
  const proposalPage = document.getElementById('proposal-page');
  const trapPage = document.getElementById('trap-page');
  const noBtn = document.getElementById('no');
  const yesBtn = document.getElementById('yes');

  // Play music on first user interaction anywhere on the page
  function playMusic() {
    music.play().catch(() => {
      console.log('Autoplay prevented, try interacting manually');
    });
    document.removeEventListener('click', playMusic);
  }
  document.addEventListener('click', playMusic);

  // NO button runs away EVERY time mouse enters
  noBtn.addEventListener('mouseenter', () => {
    meowSound.currentTime = 0;
    meowSound.play();

    const maxX = window.innerWidth - noBtn.offsetWidth - 20;
    const maxY = window.innerHeight - noBtn.offsetHeight - 20;

    let newX, newY;
    do {
      newX = Math.random() * maxX;
      newY = Math.random() * maxY;
    } while (
      Math.abs(newX - noBtn.offsetLeft) < 80 &&
      Math.abs(newY - noBtn.offsetTop) < 80
    );

    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';

    proposalPage.style.animation = 'shake 0.5s';
    setTimeout(() => {
      proposalPage.style.animation = '';
    }, 500);
  });

  // YES button switches page and triggers confetti + cats
  yesBtn.onclick = () => {
    proposalPage.classList.add('hidden');
    trapPage.classList.remove('hidden');
    startConfetti();
    spawnFloatingCats();
  };

  // Initialize NO button position on load
  window.addEventListener('load', () => {
    noBtn.style.left = '180px';
    noBtn.style.top = '10px';
  });

  // CONFETTI CODE adapted from simple JS confetti
  function startConfetti() {
    const colors = ['#ff0a54', '#ff477e', '#ff85a1', '#fbb1b1', '#f9bec7', '#a60303'];
    const confettiCount = 150;

    for(let i = 0; i < confettiCount; i++) {
      const confetti = document.createElement('div');
      confetti.style.position = 'fixed';
      confetti.style.width = '10px';
      confetti.style.height = '10px';
      confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.top = Math.random() * window.innerHeight + 'px';
      confetti.style.left = Math.random() * window.innerWidth + 'px';
      confetti.style.opacity = 1;
      confetti.style.borderRadius = '50%';
      confetti.style.pointerEvents = 'none';
      confetti.style.zIndex = 9999;

      confetti.style.animation = `confettiFall ${2 + Math.random() * 3}s linear forwards`;
      confetti.style.animationDelay = (Math.random() * 1.5) + 's';

      document.body.appendChild(confetti);

      // Remove confetti after animation
      confetti.addEventListener('animationend', () => confetti.remove());
    }
  }

  // Floating cats
  let floatingCatsInterval;

  function spawnFloatingCats() {
    const catUrls = [
      "https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif",
      "https://media.giphy.com/media/mlvseq9yvZhba/giphy.gif",
      "https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif"
    ];

    floatingCatsInterval = setInterval(() => {
      const cat = document.createElement('img');
      cat.src = catUrls[Math.floor(Math.random() * catUrls.length)];
      cat.className = 'floating-cat';
      cat.style.left = Math.random() * (window.innerWidth - 80) + 'px';
      cat.style.top = window.innerHeight + 80 + 'px';
      cat.style.animationDuration = (4 + Math.random() * 3) + 's';
      cat.style.animationTimingFunction = 'ease-in-out';
      cat.style.zIndex = 10000;

      document.body.appendChild(cat);

      // Animate floating up and fade out
      cat.animate([
        { transform: 'translateY(0)', opacity: 1 },
        { transform: 'translateY(-120vh)', opacity: 0 }
      ], {
        duration: 7000 + Math.random() * 3000,
        easing: 'ease-in-out'
      }).onfinish = () => cat.remove();
    }, 700);
  }
</script>

<style>
  @keyframes confettiFall {
    to {
      transform: translateY(110vh) rotate(360deg);
      opacity: 0;
    }
  }
</style>

</body>
</html>
